<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Habitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,800&family=Instrument+Sans:wght@400;500;600;700&family=Inter+Tight:wght@400;600;800&family=Space+Grotesk:wght@400;500;700&family=Fredoka:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a friendly sports club for friends; competitive but never shaming
   IDEA: a club league table and trophy room that lives in your pocket
   PICTURE: today's score dial, the live party leaderboard, gold trophies
   COLOUR+TYPE: cobalt field, trophy gold accent, coral for screens; Archivo wide for numbers, Instrument Sans for text
   LAYOUT: one phone-width column, cards stacked, bottom tab bar */
:root{color-scheme:light dark;
--bg:light-dark(#f4f2ec,#0d0e1a);--card:light-dark(#fff,#171933);--ink:light-dark(#14141c,#f1f0f7);--mut:light-dark(#5f5f6c,#a6a6bb);
--line:light-dark(#e2dfd6,#2b2d4c);--co:#3346ff;--co-ink:light-dark(#2433d6,#9aa5ff);--co2:light-dark(#e7e9ff,#222a6e);
--gold:#ffbf1f;--goldk:light-dark(#8a5d00,#ffd668);--cor:#ff6b4a;--ind:#7b61ff;--ok:light-dark(#0f7b4f,#5be0a4);
--top:var(--co);--top-ink:#fff;--on-co:#fff;--fd:Archivo,system-ui,sans-serif;--fs:112%;--fb:"Instrument Sans",system-ui,sans-serif;--bw:1px;--sh:none}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
:root[data-skin=ritual]{color-scheme:light;--bg:#F2F2EF;--card:#fff;--ink:#141414;--mut:#5E5E5E;--line:#E2E2DE;--co:#141414;--co-ink:#141414;--co2:#ECECE8;--on-co:#fff;--gold:#E8604C;--goldk:#9C3424;--cor:#E8604C;--ind:#5B6BD6;--ok:#1F7A55;--top:#fff;--top-ink:#141414;--fd:"Inter Tight",system-ui,sans-serif;--fs:100%;--fb:"Inter Tight",system-ui,sans-serif}
:root[data-skin=night]{color-scheme:dark;--bg:#0B0D26;--card:#15183D;--ink:#F3F1FF;--mut:#A9A6D6;--line:#2A2E66;--co:#B9B2FF;--co-ink:#C9C3FF;--co2:#2A2E66;--on-co:#0B0D26;--gold:#FFC94A;--goldk:#FFD668;--cor:#FF8FB1;--ind:#B9B2FF;--ok:#7CE0C3;--top:#15183D;--top-ink:#F3F1FF;--fd:"Space Grotesk",system-ui,sans-serif;--fs:100%;--fb:"Space Grotesk",system-ui,sans-serif}
:root[data-skin=pop]{color-scheme:light;--bg:#FFF4E6;--card:#fff;--ink:#2B1A12;--mut:#6E5446;--line:#2B1A12;--co:#FF7A2F;--co-ink:#8F3500;--co2:#FFE36E;--on-co:#2B1A12;--gold:#FFC21A;--goldk:#2B1A12;--cor:#E8457F;--ind:#6F55F0;--ok:#1F7A45;--top:#FF5FA2;--top-ink:#2B1A12;--fd:Fredoka,system-ui,sans-serif;--fs:100%;--fb:Fredoka,system-ui,sans-serif;--bw:2px;--sh:4px 4px 0 #2B1A12}
:root[data-skin=field]{color-scheme:light;--bg:#EEF0E8;--card:#F7F7F2;--ink:#17261F;--mut:#4E5E55;--line:#D9DCD0;--co:#1F4D3A;--co-ink:#1F4D3A;--co2:#E3ECDD;--on-co:#F7F7F2;--gold:#F2C14E;--goldk:#7A5800;--cor:#C8553D;--ind:#2B4C7E;--ok:#2E7D4F;--top:#1F4D3A;--top-ink:#F7F7F2;--fd:Fraunces,Georgia,serif;--fs:100%;--fb:"DM Sans",system-ui,sans-serif}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--fb);overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--co);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 104px}
.top{background:var(--top);color:var(--top-ink);padding:20px 16px 56px}
.top .in{max-width:520px;margin:0 auto}
.top h1{font:800 32px/1.05 var(--fd);font-stretch:var(--fs);margin:0;text-wrap:balance}
.top p{margin:6px 0 0;opacity:.85}
.lift{margin-top:-44px}
.num{font-family:var(--fd);font-stretch:var(--fs);font-weight:800}
.card{background:var(--card);border:var(--bw) solid var(--line);box-shadow:var(--sh);border-radius:20px;padding:18px;margin-bottom:14px}
.card h2{font-size:18px;margin:0 0 10px;font-weight:700}
.row{display:flex;align-items:center;gap:12px}
.sp{flex:1}
.mut{color:var(--mut)}
.small{font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid color-mix(in srgb,var(--top-ink) 45%,transparent);background:transparent;color:var(--top-ink);border-radius:999px;padding:8px 14px;min-height:40px}
.chip.on{background:var(--top-ink);color:var(--top);border-color:var(--top-ink);font-weight:600}
.btn{border:0;border-radius:14px;padding:12px 18px;min-height:46px;background:var(--co);color:var(--on-co);font-weight:600}
.btn.ghost{background:var(--co2);color:var(--co-ink)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;border:1px solid var(--cor);color:var(--cor)}
.btn.sm{min-height:40px;padding:8px 14px;border-radius:12px;font-size:15px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
input[type=text],input[type=email],input[type=password],input[type=search],input[type=number],input[type=time],textarea,select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:16px;min-height:46px}
textarea{resize:vertical;min-height:80px}
label.f{display:block;font-size:14px;font-weight:600;margin:12px 0 6px}
.dial{display:grid;grid-template-columns:140px minmax(0,1fr);gap:16px;align-items:center}
.dial svg{width:140px;height:140px}
.big{font-size:44px;line-height:1}
.habit{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.habit:first-of-type{border-top:0}
.emo{width:44px;height:44px;border-radius:14px;background:var(--co2);display:grid;place-items:center;font-size:22px;flex:none}
.tick{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;flex:none;transition:transform .15s}
.tick.on{background:var(--co);border-color:var(--co);color:var(--on-co)}
.tick.on svg{animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
.x{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--cor);flex:none}
.add{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:8px;margin-top:12px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.meter{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.meter i{display:block;height:100%;border-radius:99px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .h{font-size:12px;color:var(--mut);text-align:center}
.cell{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:color-mix(in srgb,var(--co) calc(var(--a,0)*100%),var(--card));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;font-size:14px}
.cell.hi{color:var(--on-co)}
.cell.sel{outline:3px solid var(--gold);outline-offset:1px}
.cell.fut{opacity:.4}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.lb{list-style:none;margin:0;padding:0}
.lb li{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:14px;cursor:pointer}
.lb li.me{background:var(--co2)}
.rk{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--line);flex:none;font-family:var(--fd)}
.rk.g{background:var(--gold);color:#3a2700}
.av{width:44px;height:44px;border-radius:50%;background:var(--co2);display:grid;place-items:center;font-size:24px;flex:none}
.av.xl{width:96px;height:96px;font-size:54px;border:4px solid var(--card)}
.sc{text-align:right;max-width:46%}
.sc b{display:block;white-space:nowrap}
.pcard{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:var(--bw) solid var(--line);box-shadow:var(--sh);border-radius:20px;padding:16px;margin-bottom:12px}
.pe{width:52px;height:52px;border-radius:16px;background:var(--co);display:grid;place-items:center;font-size:28px;flex:none}
.code{font-family:var(--fd);font-weight:800;font-stretch:var(--fs);letter-spacing:.12em;font-size:22px}
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tro{border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center;background:linear-gradient(var(--card),color-mix(in srgb,var(--gold) 12%,var(--card)))}
.tro b{display:block;font-size:14px}
.empty{text-align:center;padding:18px 8px;color:var(--mut)}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.stats3 .num{font-size:28px;display:block}
.avpick{display:flex;flex-wrap:wrap;gap:8px}
.avpick label{cursor:pointer}
.avpick input{position:absolute;opacity:0;pointer-events:none}
.avpick span{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:26px;border:2px solid var(--line)}
.avpick input:checked+span{border-color:var(--co);background:var(--co2)}
.avpick input:focus-visible+span{outline:3px solid var(--co)}
.chs{display:grid;gap:8px}
.cho{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px;background:transparent;text-align:left;width:100%}
.cho.on{border-color:var(--co);background:var(--co2)}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.skin{display:flex;flex-direction:column;gap:8px;align-items:flex-start;border:2px solid var(--line);border-radius:16px;padding:12px;background:transparent;text-align:left;min-height:44px}
.skin.on{border-color:var(--co);background:var(--co2)}
.skin .sw{display:flex;gap:4px}.skin .sw i{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.board{display:grid;width:100%;max-width:460px;margin:0 auto;border-radius:12px;overflow:hidden;border:var(--bw) solid var(--line)}
.b8{grid-template-columns:repeat(8,minmax(0,1fr))}
.sq{aspect-ratio:1;border:0;padding:0;display:grid;place-items:center;position:relative;line-height:1}
.sq.l{background:color-mix(in srgb,var(--co2) 75%,var(--card))}.sq.d{background:color-mix(in srgb,var(--co) 55%,var(--card))}
.sq.last{box-shadow:inset 0 0 0 999px color-mix(in srgb,var(--gold) 28%,transparent)}
.sq.sel{box-shadow:inset 0 0 0 4px var(--gold)}
.sq.dot::after{content:"";width:28%;height:28%;border-radius:50%;background:color-mix(in srgb,var(--ink) 35%,transparent);position:absolute}
.sq.cap{box-shadow:inset 0 0 0 4px color-mix(in srgb,var(--ink) 45%,transparent)}
.pc{font-size:clamp(24px,8.4vw,42px);font-family:"Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans",serif}
.pc.w{color:#fff;text-shadow:0 0 1px #000,0 0 2px #000,0 1px 2px #000}.pc.b{color:#141414;text-shadow:0 0 2px rgba(255,255,255,.7)}
.ck{width:74%;height:74%;border-radius:50%;display:grid;place-items:center;font-size:clamp(14px,4.4vw,22px);font-family:"Segoe UI Symbol","DejaVu Sans",serif}
.ck.w{background:#f7f3ea;color:#8a5d00;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 1px 2px rgba(0,0,0,.4)}
.ck.b{background:#1d1d24;color:#ffbf1f;box-shadow:inset 0 -4px 0 rgba(255,255,255,.12),0 1px 2px rgba(0,0,0,.4)}
.c4{grid-template-columns:repeat(7,minmax(0,1fr));background:var(--co);padding:6px;gap:4px;border-radius:16px}
.hole{aspect-ratio:1;border:0;padding:3px;background:transparent;display:grid;place-items:center}
.disc{width:100%;height:100%;border-radius:50%;background:var(--bg)}.disc.r{background:#e8304b}.disc.y{background:#ffc21a}.disc.win{outline:4px solid var(--card);outline-offset:-4px}
.t3{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border:0;max-width:340px}
.tcell{aspect-ratio:1;border:var(--bw) solid var(--line);border-radius:16px;background:var(--card);font:800 clamp(40px,14vw,64px)/1 var(--fd);color:var(--co-ink)}
.tcell.win{background:var(--co2)}
.mem{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;border:0;max-width:380px}
.card2{aspect-ratio:1;border:0;border-radius:14px;background:var(--co);color:var(--co);font-size:clamp(28px,9vw,40px);font-family:"Segoe UI Symbol","DejaVu Sans",serif}
.card2.up{background:var(--card);color:var(--ink);border:2px solid var(--co)}.card2.done{background:var(--co2);border-color:var(--co2);color:var(--co-ink)}
.tbadge{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--cor);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.badge{min-width:24px;height:24px;border-radius:12px;background:var(--cor);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;padding:0 7px}
.frow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:12px 0;min-height:64px}
.msgs{display:flex;flex-direction:column;gap:8px}
.bub{max-width:80%;padding:10px 14px;border-radius:18px;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.bub time{font-size:11px;opacity:.7}
.bub.me{align-self:flex-end;background:var(--co);color:var(--on-co);border-bottom-right-radius:6px}
.bub.them{align-self:flex-start;background:var(--card);border:var(--bw) solid var(--line);border-bottom-left-radius:6px}
.composer{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));display:flex;gap:8px;padding:10px max(16px,calc(50% - 244px));background:var(--bg);border-top:1px solid var(--line);z-index:4}
.composer input{flex:1}
.days{border:0;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}.days legend{margin-bottom:6px}
.days label{cursor:pointer}.days input{position:absolute;opacity:0;pointer-events:none}
.days span{display:grid;place-items:center;min-width:44px;height:44px;padding:0 8px;border-radius:12px;border:var(--bw) solid var(--line);background:var(--card);font-weight:600;font-size:14px}
.days input:checked+span{background:var(--co);border-color:var(--co);color:var(--on-co)}.days input:focus-visible+span{outline:3px solid var(--co)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs .in{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));width:100%;max-width:520px}
.tabs button{position:relative;border:0;background:transparent;padding:10px 2px 12px;min-height:64px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--mut)}
.tabs button.on{color:var(--co-ink);font-weight:700}
.tabs svg{width:24px;height:24px}
.ov{position:fixed;inset:0;background:rgba(10,10,30,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px 28px}
.sheet h2{font:800 26px/1.1 var(--fd);font-stretch:var(--fs);margin:0 0 6px}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:20;max-width:90vw;font-size:15px}
.note{background:color-mix(in srgb,var(--gold) 22%,var(--card));border:1px solid color-mix(in srgb,var(--gold) 50%,var(--line));border-radius:14px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.load{min-height:80vh;display:grid;place-items:center;text-align:center;color:var(--mut)}
.hint-ok{color:var(--ok)}.hint-bad{color:var(--cor)}
.err{color:var(--cor);font-size:14px;margin-top:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.dial{grid-template-columns:110px minmax(0,1fr)}.dial svg{width:110px;height:110px}.big{font-size:36px}}
</style>
</head>

{

function vCal(){
 const m=S.calM,days=myDays(),g=goals(),first=parseK(m+'-01'),lead=(first.getDay()+6)%7,t=todayK();
 let cells=['M','T','W','T','F','S','S'].map(x=>`<div class="h">${x}</div>`).join('')+'<div></div>'.repeat(lead);
 for(const k of monthDays(m)){const d=days[k]||{},a=d.total?Math.min(1,d.done/d.total):0,fut=k>t;
  const dots=(num(d.sleepH)&&d.sleepH>=g.sleepH?'<i style="background:var(--ind)"></i>':'')+(num(d.screenMin)&&d.screenMin<=g.screenMin?'<i style="background:var(--cor)"></i>':'')+(evs().some(e=>e.date===k)?'<i style="background:var(--gold);outline:1px solid var(--goldk)"></i>':'');
  cells+=`<button class="cell ${a>.55?'hi':''} ${k===S.calSel?'sel':''} ${fut?'fut':''}" style="--a:${(a*.9).toFixed(2)}" data-act="calday" data-k="${k}" aria-label="${esc(dLabel(k))}"><span>${+k.slice(8)}</span><span class="dots">${dots}</span></button>`}
 const sel=S.calSel&&S.calSel.slice(0,7)===m?S.calSel:null;let det='';
 if(sel&&sel<=t){const d=days[sel]||{},st=priv(),act=st.habits.filter(h=>activeOn(h,sel)),done=act.filter(h=>(st.logs[sel]||[]).includes(h.id)),miss=act.filter(h=>!(st.logs[sel]||[]).includes(h.id));
  det=`<section class="card"><h2>${esc(dLabel(sel))}</h2><div class="small mut">Habits</div><p style="margin:4px 0 10px">${done.length?done.map(h=>esc((h.emoji||'')+' '+h.name)).join(', '):'None ticked'}${miss.length&&done.length?`<br><span class="mut small">Missed: ${miss.map(h=>esc(h.name)).join(', ')}</span>`:''}</p>
  <div class="two"><div><div class="small mut">Sleep</div><div class="num" style="font-size:22px">${num(d.sleepH)?fmtMin(d.sleepH*60):'—'}</div>${d.bed?`<div class="small mut">${esc(d.bed)}${d.wake?' to '+esc(d.wake):''}</div>`:''}</div><div><div class="small mut">Screen time</div><div class="num" style="font-size:22px">${num(d.screenMin)?fmtMin(d.screenMin):'—'}</div></div></div></section>`}
 const s=dayStreaks(days);
 return `<header class="top"><div class="in"><h1>My calendar</h1><p>Current streak ${s.cur} perfect day${s.cur==1?'':'s'} · best ${s.best}</p></div></header>
 <main class="wrap lift">${banners()}<section class="card"><div class="row" style="margin-bottom:12px"><button class="btn line sm" data-act="calm" data-n="-1" aria-label="Previous month">‹</button><h2 class="sp" style="text-align:center;margin:0">${mLabel(m)}</h2><button class="btn line sm" data-act="calm" data-n="1" aria-label="Next month">›</button></div>
 <div class="cal">${cells}</div><div class="legend"><span><i style="background:var(--co)"></i>Habits done (darker = more)</span><span><i style="background:var(--ind)"></i>Sleep goal met</span><span><i style="background:var(--cor)"></i>Screen goal met</span><span><i style="background:var(--gold)"></i>Reminder</span></div></section>${remCard(sel)}${det}${upcomingCard()}</main>`;
}

 clearTimeout(uTimer);const seq=++uSeq;uTimer=setTimeout(async()=>{const {data,error}=await sb.rpc('username_available',{u});if(seq!==uSeq)return;const h=$('#uhint');if(!h||error)return;h.textContent=data?`@${u} is available.`:`@${u} is already taken.`;h.className='small hint-'+(data?'ok':'bad')},350);

function ready(){setTimeout(checkReminders,0);if(S.loaded.p&&S.loaded.v&&!S.ready){S.ready=true;render()}awardCheck();soon()}
async function boot(){
 if(!window.supabase){S.ready=true;S.slow=true;$('#app').innerHTML='<main class="wrap"><div class="load"><p>Habitor couldn\'t load. Check your connection and reload.</p></div></main>';return}
 sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{storage:window.sessionStorage,storageKey:'habitor-auth',persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 sb.auth.onAuthStateChange((ev,s)=>{if(s&&(ev==='TOKEN_REFRESHED'||ev==='SIGNED_IN')){const sv=saved();if(sv[s.user.id]){sv[s.user.id].rt=s.refresh_token;sv[s.user.id].at=s.access_token;setSaved(sv)}}});
 let session=(await sb.auth.getSession()).data.session;
 if(!session){const act=LS.get('habitor-active',null),sv=saved();if(act&&sv[act]){const r=await sb.auth.setSession({access_token:sv[act].at,refresh_token:sv[act].rt});if(!r.error&&r.data.session)session=r.data.session;else{delete sv[act];setSaved(sv)}}}
 if(S.out&&!savedAccts().length)S.out=false;
 if(session&&!S.out)await enter(session.user.id);else{S.ready=true;render()}
}
boot();

}
